name: Bug report
description: Report a reproducible Fluxus bug without private data
title: "bug: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "For vulnerabilities, use the private security report link on the template chooser. Do not post secrets or live exploit details here."
  - type: input
    id: version
    attributes:
      label: Version or commit
      description: Name the commit or exact package version and how you obtained it.
      placeholder: "main at abc1234 / locally packed 0.1.0"
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Provide a short code sample or steps using public test data.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behavior
      description: Include any thrown error with secrets removed.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: "Node 22.23.2, macOS; or Chrome desktop"
    validations:
      required: true
