name: Verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      - name: Install Yarn 1
        run: npm install --global yarn@1.22.22
      - name: Install frozen dependencies
        run: yarn install --frozen-lockfile --non-interactive
      - name: Lint, docs, types, tests, build and consumer package
        run: yarn verify
