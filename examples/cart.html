<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="A browser cart with one Fluxus store for items and totals.">
  <title>Cart · Fluxus examples</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <header class="site-header">
    <a class="brand" href="./todo.html"><span class="brand-mark" aria-hidden="true">F</span> Fluxus</a>
    <nav class="site-nav" aria-label="Examples">
      <a href="./todo.html">Tasks</a>
      <a href="./counter.html">Counter</a>
      <a href="./cart.html" aria-current="page">Cart</a>
      <a href="./auth.html">Session</a>
    </nav>
  </header>
  <main class="demo-layout">
    <section class="intro" aria-labelledby="page-title">
      <p class="eyebrow">03 / shared state</p>
      <h1 id="page-title">Keep the total.</h1>
      <p>Add a few desk essentials. Item removal and the total both derive from the same store.</p>
      <div class="intro-meta"><span>Immutable updates</span><span>No checkout</span></div>
    </section>
    <section class="workspace" aria-labelledby="workspace-title">
      <div class="workspace-head">
        <h2 id="workspace-title">Sample cart</h2>
        <span class="section-kicker">Local demo</span>
      </div>
      <div class="workspace-body shop-grid">
        <section id="products" aria-labelledby="products-title">
          <h3 id="products-title">Products</h3>
          <div class="product-list">
            <button class="secondary" id="addItem1" type="button">Field notebook <span>$10</span></button>
            <button class="secondary" id="addItem2" type="button">Desk timer <span>$20</span></button>
            <button class="secondary" id="addItem3" type="button">Ink pen <span>$15</span></button>
          </div>
        </section>
        <section id="cart" aria-labelledby="cart-title">
          <h3 id="cart-title">Your cart</h3>
          <ul id="cartItems" class="item-list" aria-label="Cart items"></ul>
          <p class="cart-total" role="status">Total <strong>$<span id="total">0.00</span></strong></p>
          <button class="danger" id="clearCart" type="button">Clear cart</button>
        </section>
      </div>
    </section>
  </main>
  <script type="module">
    import { createStore, createAction, createReducer } from '../dist/index.mjs';

    const addItem = createAction('ADD_ITEM');
    const removeItem = createAction('REMOVE_ITEM');
    const clearCart = createAction('CLEAR_CART');
    const initialState = { items: [], total: 0 };
    const reducer = createReducer(initialState, {
      [addItem.type]: (state, action) => ({
        items: [...state.items, action.payload],
        total: state.total + action.payload.price,
      }),
      [removeItem.type]: (state, action) => {
        const index = state.items.findIndex((item) => item.id === action.payload);
        if (index < 0) return state;
        return {
          items: [...state.items.slice(0, index), ...state.items.slice(index + 1)],
          total: state.total - state.items[index].price,
        };
      },
      [clearCart.type]: () => initialState,
    });
    const store = createStore(reducer, initialState);
    const cartItems = document.getElementById('cartItems');
    const total = document.getElementById('total');
    const clear = document.getElementById('clearCart');

    function render() {
      const { items, total: amount } = store.getState();
      const fragment = document.createDocumentFragment();
      for (const item of items) {
        const row = document.createElement('li');
        row.className = 'cart-row';
        const name = document.createElement('span');
        name.className = 'cart-name';
        name.textContent = `${item.name} · $${item.price.toFixed(2)}`;
        const removeButton = document.createElement('button');
        removeButton.type = 'button';
        removeButton.className = 'text-button';
        removeButton.textContent = 'Remove';
        removeButton.setAttribute('aria-label', `Remove ${item.name}`);
        removeButton.addEventListener('click', () => store.dispatch(removeItem(item.id)));
        row.append(name, removeButton);
        fragment.append(row);
      }
      cartItems.replaceChildren(fragment);
      total.textContent = amount.toFixed(2);
      clear.disabled = items.length === 0;
    }

    store.subscribe(render);
    document.getElementById('addItem1').addEventListener('click', () =>
      store.dispatch(addItem({ id: 1, name: 'Field notebook', price: 10 })));
    document.getElementById('addItem2').addEventListener('click', () =>
      store.dispatch(addItem({ id: 2, name: 'Desk timer', price: 20 })));
    document.getElementById('addItem3').addEventListener('click', () =>
      store.dispatch(addItem({ id: 3, name: 'Ink pen', price: 15 })));
    clear.addEventListener('click', () => store.dispatch(clearCart()));
    render();
  </script>
</body>
</html>
